name: CI Arremate

# Diz quando o robô deve rodar (neste caso, em todo push ou pull request na branch main)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  testar-app:
    runs-on: ubuntu-latest

    steps:
    # 1. Pega o código atual do seu repositório
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    # 2. Configura o ambiente Python na nuvem do GitHub
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    # 3. Instala as dependências do projeto (Flask, etc.)
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Roda o arquivo de testes que já existe no seu projeto!
    
    - name: Executar testes unitários
      env:
        PYTHONPATH: src
      run: python -m unittest discover -s src/arremate/tests -t .
